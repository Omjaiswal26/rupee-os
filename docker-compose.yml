services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rupee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rupee_secret}
      POSTGRES_DB: ${POSTGRES_DB:-rupee_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rupee} -d ${POSTGRES_DB:-rupee_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    environment:
      # Parallel in-flight generations. Keep ≈ CLASSIFY_CONCURRENCY (CPU: 2 is safe on ~8GB Docker VM).
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://rupee:rupee_secret@postgres:5432/rupee_os?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_HEALTH_MODEL: ${OLLAMA_HEALTH_MODEL:-qwen2.5:7b}
      UPLOAD_DIR: /data/uploads
      MIGRATIONS_PATH: /app/migrations
      API_ADDR: ":8080"
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://rupee:rupee_secret@postgres:5432/rupee_os?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      CLASSIFY_CONCURRENCY: ${CLASSIFY_CONCURRENCY:-2}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  uploads_data:
